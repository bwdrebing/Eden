name: Surge PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: surge-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hello-world/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: hello-world
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        working-directory: hello-world
        run: npm run build
        env:
          # package.json pins homepage to the production GitHub Pages URL. A
          # preview is served from a per-PR surge.sh domain instead, so build
          # relative asset paths rather than absolute ones.
          PUBLIC_URL: '.'
          # Matches deploy.yml: one pre-existing lint warning fails the build
          # under CI=true.
          CI: 'false'

      - uses: afc163/surge-preview@v1
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dist: hello-world/build
          teardown: 'true'
          failOnError: 'true'
          # The build ran in the steps above. This has to stay a real
          # executable: the action runs each line directly rather than
          # through a shell, and leaving it empty makes it fall back to
          # npm install && npm run build at the repo root, which has no
          # package.json.
          build: echo "Build completed in a previous step"
